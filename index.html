<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico"> 
    <meta name="theme-color" content="#242424">
    <meta name="viewport" content="maximum-scale=1, minimum-scale=1, initial-scale=1, width=device-width, user-scalable=no"/>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-status-bar-style" content="black-translucent">
    <title>HEHEChat</title>
    <title>Twitchs finest chat app</title>
    <script>
      // Recovery shim: if a hashed bundle 404s (stale cached HTML referencing
      // a JS hash that no longer exists), force a one-shot cache-busting reload.
      window.addEventListener('error', (e) => {
        const t = e && e.target;
        if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
        const src = t.src || t.href || '';
        if (!src.includes('/assets/')) return;
        if (sessionStorage.getItem('hehe-reload-recovery')) return;
        sessionStorage.setItem('hehe-reload-recovery', '1');
        location.replace(location.pathname + '?cb=' + Date.now());
      }, true);

      // Register service worker for PWA and push notifications
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(registration => {
              console.log('Service Worker registered with scope:', registration.scope);
            })
            .catch(error => {
              console.error('Service Worker registration failed:', error);
            });
        });
      }
    </script>
    <style>
      * {
        user-select: none;
        -webkit-user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
